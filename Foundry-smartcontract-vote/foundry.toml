# ============================================================
# VoteSecure — Foundry Smart Contract Suite
# Production-grade decentralized voting infrastructure
# ============================================================

[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
script   = "script"
cache    = true
cache_path = "cache"

# Optimizer — high runs for frequently-called contracts
optimizer        = true
optimizer_runs   = 200
via_ir           = true

# Solidity version
solc_version = "0.8.24"

# Remappings
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
  "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
  "@solmate/=lib/solmate/src/",
]

# Gas reporting
gas_reports = ["ElectionFactory", "VoteProtocol", "VoteFeeEscrow", "Election", "IdentityRegistry"]

# Fuzz config
[fuzz]
runs = 1000
max_test_rejects = 65536
seed = "0x3e8"

# Invariant config
[invariant]
runs         = 256
depth        = 50
call_override = false

# ── CI / high-run profile ────────────────────────────────────
[profile.ci]
optimizer_runs = 1000
fuzz           = { runs = 10000 }
invariant      = { runs = 1000, depth = 100 }

# ── Deployment profiles ──────────────────────────────────────
[profile.production]
optimizer        = true
optimizer_runs   = 1000
via_ir           = true

# ── RPC endpoints ────────────────────────────────────────────
[rpc_endpoints]
localhost    = "http://127.0.0.1:8545"
sepolia      = "${SEPOLIA_RPC_URL}"
polygon      = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
arbitrum     = "${ARBITRUM_RPC_URL}"
arbitrum_sep = "${ARBITRUM_SEPOLIA_RPC_URL}"
mainnet      = "${MAINNET_RPC_URL}"
base         = "${BASE_RPC_URL}"

# ── Etherscan verification ────────────────────────────────────
[etherscan]
mainnet      = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/api" }
sepolia      = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
polygon      = { key = "${POLYGONSCAN_API_KEY}", url = "https://api.polygonscan.com/api" }
polygon_amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
arbitrum     = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
base         = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }

# ── fmt ──────────────────────────────────────────────────────
[fmt]
line_length          = 120
tab_width            = 4
bracket_spacing      = true
int_types            = "long"
multiline_func_header = "attributes_first"
quote_style          = "double"
number_underscore    = "thousands"
wrap_comments        = true
