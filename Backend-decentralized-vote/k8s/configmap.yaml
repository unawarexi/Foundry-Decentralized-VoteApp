# ============================================================================
# VoteSecure — Kubernetes ConfigMap
# Non-sensitive configuration values
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: votesecure-api-config
  namespace: votesecure
  labels:
    app: votesecure-api
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"

  # Rate limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_MAX: "20"
  VOTE_RATE_LIMIT_MAX: "10"
  ELECTION_CREATE_RATE_LIMIT_MAX: "5"
  WALLET_RATE_LIMIT_MAX: "30"

  # Pagination
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"

  # File uploads
  MAX_FILE_SIZE: "10485760"
  ALLOWED_FILE_TYPES: "image/jpeg,image/png,image/webp,application/pdf"

  # Election configuration
  MAX_CANDIDATES_PER_ELECTION: "50"
  MAX_REGIONS_PER_ELECTION: "200"
  ELECTION_CODE_LENGTH: "10"

  # WebSocket / blockchain
  SOCKET_IO_CORS_ORIGIN: "*"
  SOCKET_IO_PING_TIMEOUT: "60000"
  SOCKET_IO_PING_INTERVAL: "25000"
  BLOCKCHAIN_NETWORK: "polygon"
