  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  chewie: ^1.12.1
  dio: ^5.8.0+1
  get_storage: ^2.1.1
  hive_flutter: ^1.1.0
  socket_io_client: ^3.1.4
  iconsax: ^0.0.8
